# Runs the repository's backend, frontend, and bridge verification checks.
# dont go into the forest alone with sub agents
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# Read-only default for every job; jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Started here, not as a service container: a service blocks the job for
      # ~20 s until its health check passes, before the first step can run
      # (#1020). This way PostgreSQL boots while the dependencies install, and
      # the test step waits for it only if it is still starting.
      - name: Start PostgreSQL
        run: |
          docker run --detach --name postgres --publish 5432:5432 \
            --env POSTGRES_USER=wrzdj --env POSTGRES_PASSWORD=wrzdj --env POSTGRES_DB=wrzdj_test \
            postgres:18

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # No dependency cache: a cold uv install is faster than restoring one.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # uv resolves from the pyproject.toml floors exactly as pip did (this job
      # deliberately does not install from uv.lock) and installs in a fraction
      # of the time. pip is upgraded too because pip-audit audits it.
      - name: Install dependencies
        run: uv pip install --system --compile-bytecode --upgrade-package pip pip -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Format check with ruff
        run: ruff format --check .

      # The frontend job regenerates the TypeScript types from server/openapi.json,
      # but nothing checks that file against the app itself. Regenerate it with the
      # same script developers use, so a route or schema change without a re-export
      # fails here instead of drifting silently. Needs no database, so it runs early.
      - name: Check committed OpenAPI schema is current
        env:
          JWT_SECRET: test-secret-key
          ENV: development
        run: |
          python scripts/export_openapi.py
          git diff --exit-code -- openapi.json || {
            echo "::error file=server/openapi.json::openapi.json is stale. Run 'python scripts/export_openapi.py' in server/, then 'npm run types:generate' in dashboard/, and commit both files."
            exit 1
          }

      - name: Security scan with bandit
        run: bandit -r app -c pyproject.toml

      - name: Dependency audit with pip-audit
        # Ignored CVEs (each requires explicit justification + revisit cadence):
        #   CVE-2024-23342 (ecdsa timing attack) - transitive from python-jose, no fix released yet
        #   CVE-2026-3219  (pip 26.x: concatenated tar/ZIP handling, CVSS 4.6 MEDIUM) -
        #                  affects pip the build tool, not runtime deps. Our CI installs from
        #                  pinned requirements only; no untrusted-source install path. Fix is
        #                  in pip PR #13870; revisit when GitHub Actions ships a patched pip.
        #   CVE-2026-6357  (pip 26.x: PATH handling) - same class as above; affects pip the
        #                  build tool only, not runtime deps. Revisit when GHA upgrades pip.
        #   PYSEC-2025-183 (pyjwt 2.10.1+ weak encryption, DISPUTED) - no fix released, the
        #                  pyjwt maintainers contest the advisory. We already pin pyjwt to the
        #                  latest available (2.12.1). Revisit when an upstream fix lands.
        #   MAL-2026-4750  (fastapi 0.136.3 "malicious code", WITHDRAWN by OSV 2026-05-26) -
        #                  False positive. 0.136.3 is an official tiangolo release; the flagged
        #                  dependency 'fastar' is a legitimate Rust-tar-bindings package
        #                  (published Oct 2025, predates the release) and is pulled ONLY via
        #                  fastapi's [standard] extra, which we do NOT install (we use plain
        #                  fastapi + uvicorn[standard]) - so it never enters our dependency tree.
        #                  We deliberately stay on 0.136.3 for its underscore-header rejection
        #                  (PR #15589) and SSE field validation (PR #15588). OSV withdrew the
        #                  advisory; pip-audit's feed still serves it. REMOVE this ignore once
        #                  the withdrawn entry is purged from the feed.
        run: pip-audit --ignore-vuln CVE-2024-23342 --ignore-vuln CVE-2026-3219 --ignore-vuln CVE-2026-6357 --ignore-vuln PYSEC-2025-183 --ignore-vuln MAL-2026-4750

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+psycopg://wrzdj:wrzdj@localhost:5432/wrzdj_test
          JWT_SECRET: test-secret-key
          ENV: development
          # @pytest.mark.postgres tests run on this service too (own schemas, dropped after)
          TEST_POSTGRES_URL: postgresql+psycopg://wrzdj:wrzdj@localhost:5432/wrzdj_test
        run: |
          # TCP, not the socket: the image's first-boot server listens on the
          # socket only, so this passes once the real server accepts connections.
          timeout 60 sh -c 'until docker exec postgres pg_isready -h 127.0.0.1 -U wrzdj -d wrzdj_test; do sleep 1; done'
          pytest -n 4 --dist=loadfile --cov=app --cov-report=xml --cov-report=term-missing --durations=25 --durations-min=1.0

      - name: Check Alembic migrations are up to date
        env:
          DATABASE_URL: postgresql+psycopg://wrzdj:wrzdj@localhost:5432/wrzdj_test
          JWT_SECRET: test-secret-key
          ENV: development
        run: alembic upgrade head && alembic check

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: server/coverage.xml
          flags: backend
          fail_ci_if_error: false

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: |
          # The compiler must be TypeScript 7 (@typescript/native), not the 6.x
          # API package that the lint and codegen tools import.
          npx tsc --version | grep -q '^Version 7\.'
          npx tsc --noEmit

      # Runs the real generator, so a dependency bump that breaks it (or a
      # server/openapi.json change without regenerated types) fails here.
      - name: Check generated API types are current
        run: |
          npm run types:generate
          git diff --exit-code -- lib/api-types.generated.ts

      - name: Run tests with coverage
        run: npm test -- --run --coverage

      - name: Test the npm audit gate
        run: node --test ../scripts/npm-audit-gate.test.cjs

      - name: Test dependency reporting shell safety
        run: node --test ../scripts/dependency-health.test.cjs

      - name: Security audit
        # Blocking: high/critical advisories fail unless .npm-audit-ignore.json
        # lists them with a justification and an unexpired date.
        run: node ../scripts/npm-audit-gate.cjs

  bridge:
    name: Bridge Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: bridge/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests with coverage
        run: npm test -- --run --coverage

      - name: Security audit
        # Blocking: high/critical advisories fail unless .npm-audit-ignore.json
        # lists them with a justification and an unexpired date.
        run: node ../scripts/npm-audit-gate.cjs

  bridge-app:
    name: Bridge App Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge-app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: bridge-app/package-lock.json

      - name: Install bridge dependencies
        working-directory: bridge
        run: npm ci

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm test -- --run --coverage

      - name: Package and test Electron runtime
        run: |
          npm run package -- --platform=linux --arch=x64
          node ../scripts/test-bridge-app-package.cjs \
            "out/WrzDJ Bridge-linux-x64/wrzdj-bridge.real" \
            "out/WrzDJ Bridge-linux-x64/resources"

      - name: Test packaged renderer and preload
        run: |
          xvfb-run --auto-servernum node ../scripts/test-bridge-app-ui.cjs \
            "out/WrzDJ Bridge-linux-x64/wrzdj-bridge"

      - name: Make and test AppImage
        run: |
          if ! command -v mksquashfs >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends squashfs-tools
          fi
          npm run make -- --platform=linux --arch=x64 --from-package
          appimage=$(realpath out/make/AppImage/x64/WrzDJ-Bridge.AppImage)
          artifact_dir=$(mktemp -d)
          trap 'rm -rf "$artifact_dir"' EXIT
          (cd "$artifact_dir" && "$appimage" --appimage-extract >/dev/null)
          app_dir="$artifact_dir/squashfs-root/usr/lib/wrzdj-bridge"
          node ../scripts/test-bridge-app-package.cjs \
            "$app_dir/wrzdj-bridge.real" "$app_dir/resources"
          xvfb-run --auto-servernum node ../scripts/test-bridge-app-ui.cjs \
            "$app_dir/wrzdj-bridge"

      - name: Security audit
        # Blocking: high/critical advisories fail unless .npm-audit-ignore.json
        # lists them with a justification and an unexpired date.
        run: node ../scripts/npm-audit-gate.cjs

  kiosk:
    name: Kiosk WiFi Portal Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiosk/wifi-portal

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      - name: Install test dependencies
        run: pip install pytest

      - name: Run tests
        run: python -m pytest test_portal.py -q

  docker-build:
    name: Docker Build Smoke Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64-only, no push: verifies the images build on every PR/push without
      # paying for the multi-arch (arm64-under-QEMU) publish, which now runs only
      # on main/tag pushes in docker-publish.yml. trivy.yml and docker-publish.yml
      # refer to this job by its name, "Docker Build Smoke Test"; keep it stable.
      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          platforms: linux/amd64
          push: false
          load: true
          tags: wrzdj-api:smoke
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api

      - name: Test locked API runtime
        run: bash scripts/test-api-image.sh wrzdj-api:smoke

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dashboard
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
          platforms: linux/amd64
          push: false
          load: true
          tags: wrzdj-web:smoke
          cache-from: type=gha,scope=ci-web
          cache-to: type=gha,mode=max,scope=ci-web

      - name: Test standalone web runtime
        run: bash scripts/test-web-image.sh wrzdj-web:smoke

      - name: Build bridge image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./bridge
          platforms: linux/amd64
          push: false
          load: true
          tags: wrzdj-bridge:smoke
          cache-from: type=gha,scope=ci-bridge
          cache-to: type=gha,mode=max,scope=ci-bridge

      - name: Test bridge runtime
        run: bash scripts/test-bridge-image.sh wrzdj-bridge:smoke

      - name: Build development proxy image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./deploy/dev-proxy
          platforms: linux/amd64
          push: false
          load: true
          tags: wrzdj-proxy:smoke
          cache-from: type=gha,scope=ci-proxy
          cache-to: type=gha,mode=max,scope=ci-proxy

      - name: Test proxy readiness helper
        run: timeout 120 bash scripts/test-wait-for-container-http.sh

      - name: Test proxy readiness boundary
        run: timeout 120 bash scripts/test-proxy-readiness-boundary.sh

      - name: Test development proxy runtime
        run: bash scripts/test-proxy-image.sh wrzdj-proxy:smoke

      - name: Test production nginx provisioning
        run: |
          for test in deploy/tests/test_*.sh; do
            bash "$test"
          done

  # The PostgreSQL 16 -> 18 upgrade tests take ~2.5 min, the longest step in CI. They
  # ran serially inside docker-build and set the whole workflow's wall time (#1006).
  # Their own job runs them alongside the image smoke tests; the backend image comes
  # from the layer cache docker-build writes, so this job only reads it.
  postgres-upgrade:
    name: PostgreSQL Upgrade Test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          platforms: linux/amd64
          push: false
          load: true
          tags: wrzdj-api:smoke
          cache-from: type=gha,scope=ci-api

      - name: Test PostgreSQL 16 to 18 upgrade path
        run: bash scripts/test-postgres-upgrade.sh wrzdj-api:smoke

      - name: Test PostgreSQL upgrade signal handling
        run: bash scripts/test-postgres-upgrade-signals.sh
