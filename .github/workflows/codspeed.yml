# Runs the server performance benchmarks with CodSpeed.
name: CodSpeed

on:
  push:
    branches: [main]
  # Benchmarks only cover server/, so other pull requests skip them (#1019).
  # Pushes to main always run: each one is the baseline later runs compare to.
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/codspeed.yml"
  # Allows CodSpeed to trigger backtest performance analysis for initial data.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmarks:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OpenID Connect authentication with CodSpeed
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"

      # No dependency cache: a cold uv install is faster than restoring one.
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      # Same install as ci.yml's backend job: uv, from the pyproject.toml floors.
      - name: Install dependencies
        run: uv pip install --system --compile-bytecode --upgrade-package pip pip -e ".[dev]"

      - name: Run benchmarks
        uses: CodSpeedHQ/action@61efe07e57e55bedeab750c434504de272a56e8c # v5.6.1
        with:
          mode: simulation
          working-directory: server
          run: pytest benchmarks --codspeed -o addopts="" -p no:cacheprovider
