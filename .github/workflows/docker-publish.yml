name: Docker Publish

# PR-time image validation lives in ci.yml's "Docker Build Smoke Test" (amd64,
# no push). This workflow only runs on main/tag pushes, where it does the full
# multi-arch build+push to GHCR — keeping the slow arm64-under-QEMU build off PRs.
#
# Image tags: `latest` and `main` follow HEAD of main (unreleased trunk);
# `vYYYY.MM.DD` and `sha-<commit>` are built on a release tag push, and `stable`
# is promoted to the release only after BOTH images are pushed, so a deployer on
# `stable` always gets a matching api/web pair from the newest release. Release
# tags are validated (format, commit on main) before anything is built.
on:
  push:
    branches: [main]
    tags: ['v*']

# Read-only default for every job; jobs that need more declare it themselves.
permissions:
  contents: read

# Release runs queue behind each other so two tags pushed minutes apart promote
# `stable` (and deploy) in push order rather than in build-completion order.
# Main pushes keep their own per-ref group and are never cancelled.
concurrency:
  group: ${{ github.ref_type == 'tag' && 'docker-publish-release' || format('docker-publish-{0}', github.ref) }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/wrzonance/wrzdj-api
  WEB_IMAGE: ghcr.io/wrzonance/wrzdj-web

jobs:
  # Release tags must be well-formed and point at a commit on main. Skipped on
  # main pushes; on tag pushes every other job waits for it, so a stray tag on a
  # feature branch never gets images and never moves `stable`.
  validate-release-tag:
    name: Validate release tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Require a vYYYY.MM.DD[.N] tag whose commit is on main
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          chmod +x .github/scripts/winget/validate-tag.sh
          .github/scripts/winget/validate-tag.sh "$TAG"
          git merge-base --is-ancestor "$SHA" origin/main \
            || { echo "::error::$TAG ($SHA) is not on main; refusing to publish"; exit 1; }

  publish-api:
    name: Publish API image
    needs: [validate-release-tag]
    if: always() && (needs.validate-release-tag.result == 'success' || needs.validate-release-tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.API_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          # latest=auto would also stamp `latest` on tag pushes, so re-publishing an
          # old release could move it; only the explicit main-only entry above may.
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./server
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-web:
    name: Publish Web image
    needs: [validate-release-tag]
    if: always() && (needs.validate-release-tag.result == 'success' || needs.validate-release-tag.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          image: docker.io/tonistiigi/binfmt:qemu-v10.2.3-68@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.WEB_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          # latest=auto would also stamp `latest` on tag pushes, so re-publishing an
          # old release could move it; only the explicit main-only entry above may.
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./dashboard
          build-args: |
            NEXT_PUBLIC_API_URL=__WRZDJ_API_URL__
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # `stable` moves only here, after both images for the release exist, by
  # retagging the pushed manifests (digest-preserving, keeps the multi-arch
  # index). If either publisher failed, `stable` stays on the previous release
  # instead of pointing api and web at different versions. promote-stable.yml
  # runs the same retag on demand to seed or roll `stable` back.
  promote-stable:
    name: Promote release to stable
    needs: [validate-release-tag, publish-api, publish-web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag ${{ github.ref_name }} as stable
        env:
          TAG: ${{ github.ref_name }}
        run: |
          for image in "$API_IMAGE" "$WEB_IMAGE"; do
            docker buildx imagetools create -t "$image:stable" "$image:$TAG"
          done

  # Every release deploys itself once its images exist and `stable` has moved:
  # SSH to the production host with a key locked (authorized_keys `command=`) to
  # the installed copy of deploy/ci-deploy.sh. The host gets the tag and the
  # commit it was built from, re-checks both, and pulls the `sha-<commit>`
  # images, so what runs is exactly what this workflow built. One-time host and
  # secret setup: deploy/DEPLOYMENT.md -> "Automated production deploy".
  deploy-production:
    name: Deploy release to production
    needs: [validate-release-tag, publish-api, publish-web, promote-stable]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://app.wrzdj.com
    steps:
      - name: Install the deploy key
        env:
          SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.PROD_DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts

      - name: Deploy the tag on the host
        env:
          TAG: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SSH_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          SSH_USER: ${{ secrets.PROD_DEPLOY_USER }}
        run: |
          # The remote side reads this "command" only as "<tag> <commit>": the
          # key's forced command is wrzdj-ci-deploy, which validates both.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            -o ConnectTimeout=20 "$SSH_USER@$SSH_HOST" "$TAG $SHA"

      - name: Verify the public API is healthy
        env:
          API_URL: ${{ vars.PROD_API_URL }}
        run: |
          curl -sSf --retry 6 --retry-delay 5 --retry-all-errors "$API_URL/health"
