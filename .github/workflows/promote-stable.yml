name: Promote Stable

# Manually point the `stable` image tag at a release: seed it after this
# workflow first lands, or roll self-hosters back if a release is bad.
# docker-publish.yml does the same retag automatically after every release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote (vYYYY.MM.DD[.N]); its commit must be on main'
        required: true
        type: string

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  API_IMAGE: ghcr.io/wrzonance/wrzdj-api
  WEB_IMAGE: ghcr.io/wrzonance/wrzdj-web

jobs:
  promote:
    name: Promote ${{ inputs.tag }} to stable
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a release tag whose commit is on main
        env:
          TAG: ${{ inputs.tag }}
        run: |
          chmod +x .github/scripts/winget/validate-tag.sh
          .github/scripts/winget/validate-tag.sh "$TAG"
          git fetch -q --tags origin
          git merge-base --is-ancestor "refs/tags/$TAG^{commit}" origin/main \
            || { echo "::error::$TAG is not on main; refusing to promote"; exit 1; }

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag both images as stable
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for image in "$API_IMAGE" "$WEB_IMAGE"; do
            docker buildx imagetools create -t "$image:stable" "$image:$TAG"
          done
