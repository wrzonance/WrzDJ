# Scans the API/web images published to GHCR and local bridge/proxy images
# for OS-package and application CVEs and uploads the results to the Security
# tab. pip-audit / npm audit in ci.yml only see our own dependency manifests;
# this is the one gate that looks at the Debian/Alpine layer underneath them.
#
# Blocking (#735): a fixable CRITICAL/HIGH finding fails the scan, and the
# "Trivy Gate" job is the single check main's branch protection requires. The
# workflow runs on every PR (no `paths:` filter) because a required check that
# never reports leaves the PR unmergeable; inside it, a PR scans only the images
# whose build context it changes (#1019). Pushes to main, the weekly schedule
# and manual runs scan every image, which is also what catches a new CVE in an
# unchanged base image. A finding that cannot be fixed yet goes in .trivyignore
# with a justification and an expiry, never a lowered gate.
name: Trivy Image Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1" # Weekly on Monday 07:00 UTC, an hour after CodeQL
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Picks the images to scan; the path rules are in scripts/ci-path-filter.cjs
  # (group "trivy"), one per `image` below.
  changes:
    name: Select Images
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select images
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          ALL_IMAGES: >-
            [
            {"image": "api", "context": "./server", "build-args": "", "cache-scope": "ci-api"},
            {"image": "web", "context": "./dashboard",
            "build-args": "NEXT_PUBLIC_API_URL=http://localhost:8000", "cache-scope": "ci-web"},
            {"image": "bridge", "context": "./bridge", "build-args": "", "cache-scope": "ci-bridge"},
            {"image": "proxy", "context": "./deploy/dev-proxy", "build-args": "", "cache-scope": "ci-proxy"}
            ]
        run: |
          selected=$(bash scripts/ci-select-jobs.sh trivy)
          echo "$selected"
          images=$(jq -c --arg selected "$selected" '
            ($selected | split("\n") | map(select(endswith("=true")) | split("=")[0])) as $on
            | map(select(.image as $image | $on | index($image)))' <<<"$ALL_IMAGES")
          echo "images=$images" >>"$GITHUB_OUTPUT"

  scan:
    name: Scan ${{ matrix.image }} image
    needs: changes
    # An empty matrix is an error, so no selected image skips the job instead.
    if: needs.changes.outputs.images != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.images) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only, loaded into the local daemon, never pushed. Reuses the
      # layer cache ci.yml's "Docker Build Smoke Test" already populates.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: false
          load: true
          tags: wrzdj-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.cache-scope }}

      - name: Scan with Trivy
        id: scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wrzdj-${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          # Without this the SARIF still carries every severity and the
          # Security tab fills with LOW/MEDIUM noise the gate does not act on.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "1"

      # Runs even when the scan step failed, so the finding that blocked the
      # PR reaches the Security tab; skipped only when the scan never ran.
      # Fork PRs and Dependabot-authored PRs run with a read-only GITHUB_TOKEN
      # and cannot upload SARIF (security-events: write is not granted); the
      # scan itself still runs and is visible in the job log.
      - name: Upload SARIF to code scanning
        if: >-
          !cancelled() && steps.scan.outcome != 'skipped' &&
          (github.event_name != 'pull_request' ||
           (github.event.pull_request.head.repo.full_name == github.repository &&
            github.actor != 'dependabot[bot]'))
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  # One stable check name for branch protection, whatever the matrix holds.
  # The job NAME must stay exactly "Trivy Gate" once main requires it.
  gate:
    name: Trivy Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, scan]
    if: always()
    permissions: {}
    steps:
      - name: Require every selected image scan to pass
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          IMAGES: ${{ needs.changes.outputs.images }}
          SCAN_RESULT: ${{ needs.scan.result }}
        run: |
          echo "Image selection: $CHANGES_RESULT; images: $IMAGES; scan: $SCAN_RESULT"
          if [ "$CHANGES_RESULT" != success ]; then
            echo "::error::Image selection result: $CHANGES_RESULT"
            exit 1
          fi
          # A skipped scan passes only when no image was selected.
          if [ "$SCAN_RESULT" = skipped ] && [ "$IMAGES" = '[]' ]; then
            exit 0
          fi
          if [ "$SCAN_RESULT" != success ]; then
            echo "::error::Trivy image scan result: $SCAN_RESULT"
            exit 1
          fi
