# Scans the API/web images published to GHCR and local bridge/proxy images
# for OS-package and application CVEs and uploads the results to the Security
# tab. pip-audit / npm audit in ci.yml only see our own dependency manifests;
# this is the one gate that looks at the Debian/Alpine layer underneath them.
#
# Non-blocking for now (exit-code 0): establish a clean baseline first, then
# promote it to a hard gate (#578).
name: Trivy Image Scan

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "dashboard/**"
      - "bridge/**"
      - "deploy/dev-proxy/**"
      - ".github/workflows/trivy.yml"
  pull_request:
    branches: [main]
    paths:
      - "server/**"
      - "dashboard/**"
      - "bridge/**"
      - "deploy/dev-proxy/**"
      - ".github/workflows/trivy.yml"
  schedule:
    - cron: "0 7 * * 1" # Weekly on Monday 07:00 UTC, an hour after CodeQL
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Scan ${{ matrix.image }} image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./server
            build-args: ""
            cache-scope: ci-api
          - image: web
            context: ./dashboard
            build-args: |
              NEXT_PUBLIC_API_URL=http://localhost:8000
            cache-scope: ci-web
          - image: bridge
            context: ./bridge
            build-args: ""
            cache-scope: ci-bridge
          - image: proxy
            context: ./deploy/dev-proxy
            build-args: ""
            cache-scope: ci-proxy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only, loaded into the local daemon, never pushed. Reuses the
      # layer cache ci.yml's "Docker Build Smoke Test" already populates.
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: false
          load: true
          tags: wrzdj-${{ matrix.image }}:scan
          cache-from: type=gha,scope=${{ matrix.cache-scope }}

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: wrzdj-${{ matrix.image }}:scan
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          # Without this the SARIF still carries every severity and the
          # Security tab fills with LOW/MEDIUM noise the gate does not act on.
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"

      # Fork PRs and Dependabot-authored PRs run with a read-only GITHUB_TOKEN
      # and cannot upload SARIF (security-events: write is not granted); the
      # scan itself still runs and is visible in the job log.
      - name: Upload SARIF to code scanning
        if: >-
          github.event_name != 'pull_request' ||
          (github.event.pull_request.head.repo.full_name == github.repository &&
           github.actor != 'dependabot[bot]')
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}
